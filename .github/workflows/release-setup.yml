name: Release Windows Setup

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a tag such as v0.4.2.' }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and check Windows Setup
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools are missing.' }
          $env:VCVARS64 = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          .\scripts\build-setup.ps1 -Version $env:RELEASE_TAG.Substring(1)
      - name: Verify setup choices and prerequisite reuse
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $setup = (Get-Item "release/MolovoxLabs-$version-x64-Setup.exe").FullName
          $log = Join-Path $env:RUNNER_TEMP 'molovox-setup.log'
          $deniedLog = Join-Path $env:RUNNER_TEMP 'molovox-setup-denied.log'
          $app = Join-Path $env:ProgramFiles 'Molovox Labs Release Test'
          $denied = Start-Process $setup -ArgumentList "/quiet /norestart /log `"$deniedLog`"" -Wait -PassThru -WindowStyle Hidden
          if ($denied.ExitCode -eq 0 -or !(Select-String -LiteralPath $deniedLog -SimpleMatch 'Review the setup terms' -Quiet) -or
              (Select-String -LiteralPath $deniedLog -SimpleMatch 'Applying execute package:' -Quiet)) {
            Get-Content $deniedLog -Tail 80
            throw 'Unattended setup did not require explicit terms acceptance.'
          }
          # A driver install can register a pending bundle restart, which blocks uninstall on this runner.
          $driverSetup = (Get-Item '.build/msi/InstallDependencies.exe').FullName
          $driver = Start-Process $driverSetup -ArgumentList 'vbcable' -Wait -PassThru -WindowStyle Hidden
          if ($driver.ExitCode -notin 0, 3010) {
            Get-ItemProperty 'HKLM:\SOFTWARE\MolovoxLabs' -Name SetupError -ErrorAction SilentlyContinue
            throw "VB-CABLE setup failed ($($driver.ExitCode))."
          }
          $result = Start-Process $setup -ArgumentList "/quiet /norestart AcceptTerms=1 DesktopShortcut=1 InstallFolder=`"$app`" /log `"$log`"" -Wait -PassThru -WindowStyle Hidden
          if ($result.ExitCode -notin 0, 3010) {
            Get-Content $log -Tail 100
            Get-ItemProperty 'HKLM:\SOFTWARE\MolovoxLabs' -Name SetupError -ErrorAction SilentlyContinue
            throw "Setup failed ($($result.ExitCode))."
          }
          $prerequisites = Select-String -LiteralPath $log -Pattern 'Applied execute package: (FFmpeg|WebView2|VBCable), result: 0x0'
          $application = Select-String -LiteralPath $log -SimpleMatch 'Applying execute package: Application,' | Select-Object -First 1
          if (!$prerequisites -or !$application -or ($prerequisites | Where-Object LineNumber -ge $application.LineNumber)) {
            throw 'Dependencies did not finish before application installation.'
          }
          if (!(Test-Path (Join-Path $app 'MolovoxLabs.exe'))) { throw 'MSI did not honor the chosen install folder.' }
          $shortcut = Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'Molovox Labs.lnk'
          if (!(Test-Path -LiteralPath $shortcut)) { throw 'MSI did not create the selected desktop shortcut.' }
          $shell = New-Object -ComObject WScript.Shell
          if ($shell.CreateShortcut($shortcut).TargetPath -ne (Join-Path $app 'MolovoxLabs.exe')) {
            throw 'The desktop shortcut does not target the chosen install folder.'
          }
          $tools = Join-Path ([Environment]::GetFolderPath('CommonProgramFiles')) 'Molovox Labs\Tools'
          $ffmpeg = Join-Path $tools 'ffmpeg.exe'
          $ffprobe = Join-Path $tools 'ffprobe.exe'
          if (!(Test-Path -LiteralPath $ffmpeg)) {
            $ffmpeg = (Get-Command ffmpeg.exe -CommandType Application).Source
            $ffprobe = (Get-Command ffprobe.exe -CommandType Application).Source
          }
          $video = Join-Path $env:RUNNER_TEMP 'molovox-codecs.mp4'
          & $ffmpeg -v error -f lavfi -i 'color=black:size=64x64' -f lavfi -i 'anullsrc' -t 1 -c:v libx264 -c:a aac $video
          if ($LASTEXITCODE -ne 0) { throw 'Installed FFmpeg could not export H.264/AAC.' }
          & $ffprobe -v error -show_entries stream=codec_name $video
          if ($LASTEXITCODE -ne 0) { throw 'Installed ffprobe could not inspect the export.' }
          $runtime = Get-ItemPropertyValue 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -Name pv
          if (!$runtime -or $runtime -eq '0.0.0.0') { throw 'The WebView2 runtime is missing after setup.' }
          $device = Get-CimInstance -ClassName Win32_PnPEntity -Filter "PNPClass = 'MEDIA' AND Present = TRUE" |
            Where-Object { $_.HardwareID -contains 'VBAudioVACWDM' }
          if (!$device) { throw 'The VB-CABLE device is missing after setup.' }
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'molovox-setup-uninstall.log'
          $uninstall = Start-Process $setup -ArgumentList "/uninstall /quiet /norestart /log `"$uninstallLog`"" -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -notin 0, 3010 -or (Test-Path -LiteralPath $shortcut)) {
            Get-Content -LiteralPath $uninstallLog -Tail 65
            throw "Uninstall exit code: $($uninstall.ExitCode). Desktop shortcut still present: $(Test-Path -LiteralPath $shortcut)."
          }
          $repeatLog = Join-Path $env:RUNNER_TEMP 'molovox-setup-repeat.log'
          $repeat = Start-Process $setup -ArgumentList "/quiet /norestart AcceptTerms=1 DesktopShortcut=0 InstallFolder=`"$app`" /log `"$repeatLog`"" -Wait -PassThru -WindowStyle Hidden
          if ($repeat.ExitCode -notin 0, 3010 -or (Test-Path -LiteralPath $shortcut)) {
            Get-Content -LiteralPath $repeatLog -Tail 65
            throw "Repeat setup exit code: $($repeat.ExitCode). Desktop shortcut present: $(Test-Path -LiteralPath $shortcut)."
          }
          if ((Test-Path -LiteralPath (Join-Path $tools 'ffmpeg.exe')) -and
              (Select-String -LiteralPath $repeatLog -SimpleMatch 'Applying execute package: FFmpeg,' -Quiet)) {
            throw 'Setup reran the FFmpeg installer even though both tools were already present.'
          }
      - name: Publish Windows Setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          gh release create $env:RELEASE_TAG "release/MolovoxLabs-$version-x64-Setup.exe" --verify-tag --notes-from-tag --title "Molovox Labs $env:RELEASE_TAG"
