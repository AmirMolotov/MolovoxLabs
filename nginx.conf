server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header Permissions-Policy "microphone=(self), camera=()" always;
    add_header X-Content-Type-Options nosniff always;
    location / {
        try_files $uri $uri/ =404;
    }
}
