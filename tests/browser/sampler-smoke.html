<!doctype html><html><meta charset="utf-8"><title>Molovox Labs video codec check</title><style>body{font:16px Segoe UI;background:#14251d;color:#dcebd7;padding:40px}button{padding:14px 24px}canvas,video{width:320px;display:block;margin:20px 0}pre{white-space:pre-wrap}</style><h1>Video sampler browser check</h1><button id="run">Run silent media check</button><canvas id="stage" width="320" height="180"></canvas><video id="preview" muted playsinline></video><pre id="result">Ready.</pre><script>
document.getElementById('run').onclick=async()=>{
 const result=document.getElementById('result');let ctx,stream,timer;
 try{result.textContent='Recording synthetic video with PCM audio…';ctx=new AudioContext({sampleRate:48000});await ctx.resume();await ctx.audioWorklet.addModule('/dist/sampler-audio-worklet.js');const node=new AudioWorkletNode(ctx,'quiet-sampler-audio',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[1]});const dest=ctx.createMediaStreamDestination();node.connect(dest);
 const canvas=document.getElementById('stage'),g=canvas.getContext('2d');let frame=0,sample=0;const feed=()=>{const pcm=new Float32Array(4800);for(let i=0;i<pcm.length;i++)pcm[i]=.1*Math.sin(2*Math.PI*440*sample++/48000);node.port.postMessage({type:'chunk',samples:pcm},[pcm.buffer]);};feed();feed();node.port.postMessage({type:'start'});timer=setInterval(()=>{g.fillStyle=frame++%2?'#b9e78d':'#5298af';g.fillRect(0,0,320,180);feed();},100);g.fillStyle='#b9e78d';g.fillRect(0,0,320,180);
 stream=canvas.captureStream(30);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));const mime=['video/webm;codecs=vp8,opus','video/webm'].find(MediaRecorder.isTypeSupported);if(!mime)throw new Error('WebM encoding is unsupported');const recorder=new MediaRecorder(stream,{mimeType:mime}),chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.start(200);await new Promise(r=>setTimeout(r,1400));await new Promise(r=>{recorder.onstop=r;recorder.stop()});clearInterval(timer);timer=null;
 const blob=new Blob(chunks,{type:mime}),audio=await new OfflineAudioContext(1,1,48000).decodeAudioData(await blob.arrayBuffer());let power=0;for(const x of audio.getChannelData(0))power+=x*x;power=Math.sqrt(power/audio.length);if(power<.01||audio.duration<1)throw new Error('Recorded PCM audio missing');const video=document.getElementById('preview');const loaded=new Promise((r,j)=>{video.onloadeddata=r;video.onerror=()=>j(new Error('Recorded video cannot decode'))});video.src=URL.createObjectURL(blob);await loaded;if(!video.videoWidth)throw new Error('Video frames missing');g.drawImage(video,video.videoWidth*.25,0,video.videoWidth*.5,video.videoHeight,0,0,320,180);const data={passed:true,mime,bytes:blob.size,audioSeconds:audio.duration,audioRMS:power,width:video.videoWidth,height:video.videoHeight,thumbnail:canvas.toDataURL('image/jpeg').slice(0,24)};await fetch('/smoke-video',{method:'POST',body:blob});await fetch('/smoke-result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});result.textContent=JSON.stringify(data,null,2);
 }catch(error){const data={passed:false,error:String(error)};result.textContent=JSON.stringify(data,null,2);await fetch('/smoke-result',{method:'POST',body:JSON.stringify(data)}).catch(()=>{});}finally{if(timer)clearInterval(timer);stream?.getTracks().forEach(t=>t.stop());await ctx?.close();}
};
</script></html>
